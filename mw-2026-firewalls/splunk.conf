table inet core_firewall
flush table inet core_firewall

delete table inet core_firewall

table inet core_firewall {
	chain input {
		type filter hook input priority 0; policy drop
		iifname lo accept

		#### TCP ####
		tcp dport 22 ct state new accept
		tcp dport 8000 ct state new accept
		#tcp dport 8065 ct state new accept
		tcp dport 8089 ct state new accept
		#tcp dport 9997 ct state new accept

		ip saddr 172.20.240.0/24 tcp dport { 5601, 5044, 1514, 1515, 443} ct state new accept 
		ip saddr 172.20.240.0/24 tcp dport 8080 ct state new accept

		#### UDP ####
		udp dport 123 ct state new accept #chrony

		icmp type { echo-request, echo-reply } ct state new accept 
		ct state established,related accept
		log prefix "inbound-drop: "drop
	}
	
	chain output {
		type filter hook output priority 0; policy drop 
		oifname lo accept
		
		ip daddr 172.20.240.100 accept
		ct state established,related accept
		log prefix "outbound-drop: " reject
	}
}
