table inet core_firewall {
	chain input {
		type filter hook input priority filter; policy drop; 
		iifname "lo" accept

		tcp dport 22 ct state new accept 
		tcp dport 25 ct state new accept 
		tcp dport 80 ct state new accept 
		tcp dport 110 ct state new accept 
		tcp dport 143 ct state new accept 
		tcp dport 443 ct state new accept 
		tcp dport 587 ct state new accept 
		tcp dport 993 ct state new accept 
		tcp dport 995 ct state new accept 
		tcp dport 8080 ct state new accept
		
		icmp type { echo-reply, echo-request } ct state new accept
		ct state established,related accept
		log prefix "inbound-drop: "drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
		oifname "lo" accept
		
		ip daddr 172.20.240.20 tcp dport 5601 ct state new accept 
		ip daddr 172.20.240.20 tcp dport 8080 ct state new accept 
		ip daddr 172.20.240.20 tcp dport 5044 ct state new accept 
		ip daddr 172.20.240.20 tcp dport 1514 ct state new accept 
		ip daddr 172.20.240.20 tcp dport 1515 ct state new accept 
		ip daddr 172.20.240.20 tcp dport 443 ct state new accept 
		ip daddr 172.20.240.120 tcp dport 1433 ct state new accept 
		ip daddr 172.20.240.100 ct state new accept

		ct state established,related accept
		log prefix "outbound-drop: " reject
	}
}
table inet jj20725.0 {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		iifname "jj20725.0.0" masquerade
	}
}
